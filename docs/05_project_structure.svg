<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2=".5" y2="1">
      <stop offset="0%" stop-color="#0c0c20"/>
      <stop offset="100%" stop-color="#151535"/>
    </linearGradient>
    <filter id="d5"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".42"/></filter>
    <filter id="g5"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1020" height="560" fill="url(#bg5)" rx="18"/>

  <text x="510" y="42" text-anchor="middle" fill="#fff" font-size="26" font-weight="800" letter-spacing="1" filter="url(#g5)">Project Structure &amp; File Map</text>
  <text x="510" y="66" text-anchor="middle" fill="#667" font-size="13">6 Java source files  ·  ~300 total lines  ·  0 external dependencies</text>

  <!-- ═══════ FILE TREE ═══════ -->
  <g transform="translate(40,90)" filter="url(#d5)">
    <rect width="340" height="420" rx="14" fill="#12122a" stroke="#4facfe" stroke-width="1.8"/>
    <rect width="340" height="30" rx="14" fill="#4facfe" opacity=".1"/>
    <text x="170" y="21" text-anchor="middle" fill="#4facfe" font-size="13" font-weight="700">📁  Directory Tree</text>
    <line x1="14" y1="35" x2="326" y2="35" stroke="#4facfe" opacity=".15"/>

    <text x="20" y="62" fill="#ffd700" font-size="14" font-weight="700">InternshipJobTracker/</text>

    <!-- files with color dots and line counts -->
    <circle cx="40" cy="89" r="5" fill="#f857a6"/><text x="52" y="93" fill="#ccc" font-size="12">Status.java</text>
    <text x="260" y="93" fill="#555" font-size="10" text-anchor="end">7 lines</text>
    <text x="270" y="93" fill="#f857a6" font-size="10">enum</text>

    <circle cx="40" cy="119" r="5" fill="#4facfe"/><text x="52" y="123" fill="#ccc" font-size="12">Application.java</text>
    <text x="260" y="123" fill="#555" font-size="10" text-anchor="end">25 lines</text>
    <text x="270" y="123" fill="#4facfe" font-size="10">abstract</text>

    <circle cx="40" cy="149" r="5" fill="#43e97b"/><text x="52" y="153" fill="#ccc" font-size="12">InternshipApplication.java</text>
    <text x="260" y="153" fill="#555" font-size="10" text-anchor="end">27 lines</text>
    <text x="270" y="153" fill="#43e97b" font-size="10">model</text>

    <circle cx="40" cy="179" r="5" fill="#fa709a"/><text x="52" y="183" fill="#ccc" font-size="12">JobApplication.java</text>
    <text x="260" y="183" fill="#555" font-size="10" text-anchor="end">27 lines</text>
    <text x="270" y="183" fill="#fa709a" font-size="10">model</text>

    <circle cx="40" cy="209" r="5" fill="#a18cd1"/><text x="52" y="213" fill="#ccc" font-size="12">ApplicationManager.java</text>
    <text x="260" y="213" fill="#555" font-size="10" text-anchor="end">78 lines</text>
    <text x="270" y="213" fill="#a18cd1" font-size="10">service</text>

    <circle cx="40" cy="239" r="5" fill="#ffecd2"/><text x="52" y="243" fill="#ccc" font-size="12">Main.java</text>
    <text x="260" y="243" fill="#555" font-size="10" text-anchor="end">146 lines</text>
    <text x="270" y="243" fill="#ffecd2" font-size="10">entry</text>

    <!-- separator -->
    <line x1="20" y1="264" x2="320" y2="264" stroke="#333" stroke-dasharray="3 3"/>

    <!-- lines breakdown bar chart -->
    <text x="20" y="290" fill="#888" font-size="11" font-weight="600">Lines of Code Breakdown</text>

    <!-- Main bar -->
    <rect x="20" y="302" width="210" height="14" rx="3" fill="#ffecd2" opacity=".2"/>
    <rect x="20" y="302" width="210" height="14" rx="3" fill="#ffecd2" opacity=".35"/>
    <text x="236" y="314" fill="#ffecd2" font-size="9">Main — 146  (47%)</text>

    <!-- Manager bar -->
    <rect x="20" y="322" width="112" height="14" rx="3" fill="#a18cd1" opacity=".2"/>
    <rect x="20" y="322" width="112" height="14" rx="3" fill="#a18cd1" opacity=".35"/>
    <text x="138" y="334" fill="#a18cd1" font-size="9">Manager — 78  (25%)</text>

    <!-- Internship bar -->
    <rect x="20" y="342" width="39" height="14" rx="3" fill="#43e97b" opacity=".35"/>
    <text x="64" y="354" fill="#43e97b" font-size="9">Internship — 27</text>

    <!-- Job bar -->
    <rect x="20" y="362" width="39" height="14" rx="3" fill="#fa709a" opacity=".35"/>
    <text x="64" y="374" fill="#fa709a" font-size="9">Job — 27</text>

    <!-- Application bar -->
    <rect x="20" y="382" width="36" height="14" rx="3" fill="#4facfe" opacity=".35"/>
    <text x="61" y="394" fill="#4facfe" font-size="9">Application — 25</text>

    <!-- Status bar -->
    <rect x="20" y="402" width="10" height="14" rx="3" fill="#f857a6" opacity=".35"/>
    <text x="36" y="414" fill="#f857a6" font-size="9">Status — 7</text>
  </g>

  <!-- ═══════ FILE DETAILS ═══════ -->
  <g transform="translate(440,90)" filter="url(#d5)">
    <rect width="540" height="420" rx="14" fill="#12122a" stroke="#a18cd1" stroke-width="1.8"/>
    <rect width="540" height="30" rx="14" fill="#a18cd1" opacity=".1"/>
    <text x="270" y="21" text-anchor="middle" fill="#a18cd1" font-size="13" font-weight="700">📝  File Responsibilities</text>
    <line x1="14" y1="35" x2="526" y2="35" stroke="#a18cd1" opacity=".15"/>

    <!-- Status -->
    <rect x="14" y="46" width="10" height="10" rx="2" fill="#f857a6"/>
    <text x="30" y="56" fill="#f857a6" font-size="12" font-weight="700">Status.java</text>
    <text x="30" y="72" fill="#999" font-size="10">Enum defining the 4 lifecycle states of any application.</text>
    <text x="30" y="86" fill="#666" font-size="10">Used by: Application (field), ApplicationManager (updateStatus), Main (valueOf parse)</text>

    <!-- Application -->
    <rect x="14" y="100" width="10" height="10" rx="2" fill="#4facfe"/>
    <text x="30" y="110" fill="#4facfe" font-size="12" font-weight="700">Application.java  <tspan fill="#555" font-size="9">«abstract»</tspan></text>
    <text x="30" y="126" fill="#999" font-size="10">Base class — 4 private fields (id, company, role, status) + getters/setters.</text>
    <text x="30" y="140" fill="#999" font-size="10">Declares abstract displayDetails() for polymorphic console output.</text>

    <!-- InternshipApplication -->
    <rect x="14" y="155" width="10" height="10" rx="2" fill="#43e97b"/>
    <text x="30" y="165" fill="#43e97b" font-size="12" font-weight="700">InternshipApplication.java</text>
    <text x="30" y="181" fill="#999" font-size="10">Extends Application — adds duration (int months) and stipend (double $).</text>
    <text x="30" y="195" fill="#999" font-size="10">Overrides displayDetails() with internship-specific output.</text>

    <!-- JobApplication -->
    <rect x="14" y="210" width="10" height="10" rx="2" fill="#fa709a"/>
    <text x="30" y="220" fill="#fa709a" font-size="12" font-weight="700">JobApplication.java</text>
    <text x="30" y="236" fill="#999" font-size="10">Extends Application — adds salary (double $) and jobType (String).</text>
    <text x="30" y="250" fill="#999" font-size="10">Overrides displayDetails() with job-specific output.</text>

    <!-- ApplicationManager -->
    <rect x="14" y="265" width="10" height="10" rx="2" fill="#a18cd1"/>
    <text x="30" y="275" fill="#a18cd1" font-size="12" font-weight="700">ApplicationManager.java  <tspan fill="#555" font-size="9">service / controller</tspan></text>
    <text x="30" y="291" fill="#999" font-size="10">Manages ArrayList&lt;Application&gt; with auto-incrementing ID (APP1, APP2...).</text>
    <text x="30" y="305" fill="#999" font-size="10">CRUD: addApplication · viewApplications · searchByCompany · updateStatus · delete.</text>
    <text x="30" y="319" fill="#999" font-size="10">Uses instanceof to detect type; uses polymorphic displayDetails() for search results.</text>

    <!-- Main -->
    <rect x="14" y="334" width="10" height="10" rx="2" fill="#ffecd2"/>
    <text x="30" y="344" fill="#ffecd2" font-size="12" font-weight="700">Main.java  <tspan fill="#555" font-size="9">entry point / UI</tspan></text>
    <text x="30" y="360" fill="#999" font-size="10">Entry point — creates Scanner + ApplicationManager, runs do-while menu loop.</text>
    <text x="30" y="374" fill="#999" font-size="10">7 menu options via switch (enhanced arrow syntax). Collects user input, delegates to manager.</text>
    <text x="30" y="388" fill="#999" font-size="10">3 input helpers with validation: getInput() · getIntInput() · getDoubleInput().</text>
    <text x="30" y="402" fill="#999" font-size="10">Delete requires confirmation (yes/y). Status update uses try-catch on Status.valueOf().</text>

    <!-- tech note -->
    <line x1="14" y1="412" x2="526" y2="412" stroke="#333"/>
    <text x="270" y="428" text-anchor="middle" fill="#555" font-size="10">Java 14+  ·  No packages  ·  Only import: java.util.Scanner, java.util.ArrayList</text>
  </g>
</svg>
