<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2=".5" y2="1">
      <stop offset="0%" stop-color="#0c0c20"/>
      <stop offset="100%" stop-color="#151535"/>
    </linearGradient>
    <filter id="d5"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".42"/></filter>
    <filter id="g5"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1020" height="560" fill="url(#bg5)" rx="18"/>

  <text x="510" y="42" text-anchor="middle" fill="#fff" font-size="26" font-weight="800" letter-spacing="1" filter="url(#g5)">Project Structure &amp; File Map</text>
  <text x="510" y="66" text-anchor="middle" fill="#667" font-size="13">6 Java source files  ·  1 CSV data file  ·  ~470 total lines</text>

  <!-- ═══════ FILE TREE ═══════ -->
  <g transform="translate(40,90)" filter="url(#d5)">
    <rect width="340" height="420" rx="14" fill="#12122a" stroke="#4facfe" stroke-width="1.8"/>
    <rect width="340" height="30" rx="14" fill="#4facfe" opacity=".1"/>
    <text x="170" y="21" text-anchor="middle" fill="#4facfe" font-size="13" font-weight="700">📁  Directory Tree</text>
    <line x1="14" y1="35" x2="326" y2="35" stroke="#4facfe" opacity=".15"/>

    <text x="20" y="62" fill="#ffd700" font-size="14" font-weight="700">InternshipJobTracker/</text>

    <!-- Source Files -->
    <circle cx="40" cy="89" r="5" fill="#f857a6"/><text x="52" y="93" fill="#ccc" font-size="12">Status.java</text>
    <text x="260" y="93" fill="#555" font-size="10" text-anchor="end">7 lines</text>

    <circle cx="40" cy="119" r="5" fill="#4facfe"/><text x="52" y="123" fill="#ccc" font-size="12">Application.java</text>
    <text x="260" y="123" fill="#555" font-size="10" text-anchor="end">25 lines</text>

    <circle cx="40" cy="149" r="5" fill="#43e97b"/><text x="52" y="153" fill="#ccc" font-size="12">InternshipApplication.java</text>
    <text x="260" y="153" fill="#555" font-size="10" text-anchor="end">27 lines</text>

    <circle cx="40" cy="179" r="5" fill="#fa709a"/><text x="52" y="183" fill="#ccc" font-size="12">JobApplication.java</text>
    <text x="260" y="183" fill="#555" font-size="10" text-anchor="end">27 lines</text>

    <circle cx="40" cy="209" r="5" fill="#a18cd1"/><text x="52" y="213" fill="#ccc" font-size="12">ApplicationManager.java</text>
    <text x="260" y="213" fill="#555" font-size="10" text-anchor="end">184 lines</text>

    <circle cx="40" cy="239" r="5" fill="#ffecd2"/><text x="52" y="243" fill="#ccc" font-size="12">Main.java</text>
    <text x="260" y="243" fill="#555" font-size="10" text-anchor="end">146 lines</text>

    <!-- Data & Config -->
    <text x="20" y="280" fill="#667" font-size="11" font-weight="600">Data &amp; Config</text>
    <circle cx="40" cy="309" r="5" fill="#ffd700"/><text x="52" y="313" fill="#ffd700" font-size="12" font-weight="700">data.csv</text>
    <text x="260" y="313" fill="#555" font-size="10" text-anchor="end">persistent state</text>
    
    <circle cx="40" cy="339" r="5" fill="#555"/><text x="52" y="343" fill="#888" font-size="12">.gitignore</text>
    <text x="260" y="343" fill="#555" font-size="10" text-anchor="end">ignores .class &amp; csv</text>
  </g>

  <!-- ═══════ FILE DETAILS ═══════ -->
  <g transform="translate(440,90)" filter="url(#d5)">
    <rect width="540" height="420" rx="14" fill="#12122a" stroke="#a18cd1" stroke-width="1.8"/>
    <rect width="540" height="30" rx="14" fill="#a18cd1" opacity=".1"/>
    <text x="270" y="21" text-anchor="middle" fill="#a18cd1" font-size="13" font-weight="700">📝  File Responsibilities</text>
    <line x1="14" y1="35" x2="526" y2="35" stroke="#a18cd1" opacity=".15"/>

    <!-- Status -->
    <rect x="14" y="46" width="10" height="10" rx="2" fill="#f857a6"/>
    <text x="30" y="56" fill="#f857a6" font-size="12" font-weight="700">Status.java</text>
    <text x="30" y="72" fill="#999" font-size="10">Enum defining the 4 lifecycle states of any application.</text>

    <!-- Application -->
    <rect x="14" y="90" width="10" height="10" rx="2" fill="#4facfe"/>
    <text x="30" y="100" fill="#4facfe" font-size="12" font-weight="700">Application.java  <tspan fill="#555" font-size="9">«abstract»</tspan></text>
    <text x="30" y="116" fill="#999" font-size="10">Base class — fields (id, company, role, status). Declares abstract displayDetails().</text>

    <!-- InternshipApplication -->
    <rect x="14" y="134" width="10" height="10" rx="2" fill="#43e97b"/>
    <text x="30" y="144" fill="#43e97b" font-size="12" font-weight="700">InternshipApplication.java</text>
    <text x="30" y="160" fill="#999" font-size="10">Extends Application — adds duration (months) and stipend ($).</text>

    <!-- JobApplication -->
    <rect x="14" y="178" width="10" height="10" rx="2" fill="#fa709a"/>
    <text x="30" y="188" fill="#fa709a" font-size="12" font-weight="700">JobApplication.java</text>
    <text x="30" y="204" fill="#999" font-size="10">Extends Application — adds salary ($) and jobType (FT/PT/Contract).</text>

    <!-- ApplicationManager -->
    <rect x="14" y="222" width="10" height="10" rx="2" fill="#a18cd1"/>
    <text x="30" y="232" fill="#a18cd1" font-size="12" font-weight="700">ApplicationManager.java  <tspan fill="#ffd700" font-size="9">service + persistence layer</tspan></text>
    <text x="30" y="248" fill="#999" font-size="10">Manages ArrayList&lt;Application&gt; &amp; handles all CRUD ops.</text>
    <text x="30" y="262" fill="#ffd700" font-size="10" font-weight="600">Handles File I/O: <tspan fill="#aaa" font-weight="normal">loadFromFile() on startup, saveToFile() syncs on mutation.</tspan></text>

    <!-- Main -->
    <rect x="14" y="280" width="10" height="10" rx="2" fill="#ffecd2"/>
    <text x="30" y="290" fill="#ffecd2" font-size="12" font-weight="700">Main.java  <tspan fill="#555" font-size="9">presentation layer</tspan></text>
    <text x="30" y="306" fill="#999" font-size="10">Entry point CLI — runs 7-option switch loop. Pure UI, delegates everything to Manager.</text>

    <!-- data.csv -->
    <rect x="14" y="324" width="10" height="10" rx="2" fill="#ffd700"/>
    <text x="30" y="334" fill="#ffd700" font-size="12" font-weight="700">data.csv  <tspan fill="#555" font-size="9">generated file</tspan></text>
    <text x="30" y="350" fill="#999" font-size="10">Stores persistent user data locally. Automatically created/updated.</text>

    <!-- .gitignore -->
    <rect x="14" y="368" width="10" height="10" rx="2" fill="#555"/>
    <text x="30" y="378" fill="#888" font-size="12" font-weight="700">.gitignore</text>
    <text x="30" y="394" fill="#999" font-size="10">Prevents compiled <tspan fill="#ccc">*.class</tspan> files and <tspan fill="#ccc">data.csv</tspan> from being checked into version control.</text>
  </g>
</svg>
