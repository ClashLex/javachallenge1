<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 680" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0%" stop-color="#0e0e24"/>
      <stop offset="100%" stop-color="#1a1440"/>
    </linearGradient>
    <filter id="d2"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="g2"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="a1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#4facfe"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#a18cd1"/></marker>
    <marker id="a3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#43e97b"/></marker>
  </defs>

  <rect width="1020" height="680" fill="url(#bg2)" rx="18"/>

  <text x="510" y="42" text-anchor="middle" fill="#fff" font-size="26" font-weight="800" letter-spacing="1" filter="url(#g2)">System Architecture</text>
  <text x="510" y="66" text-anchor="middle" fill="#667" font-size="13">Component relationships &amp; data flow — console-based CLI application</text>

  <!-- ════════ LAYER LABELS ════════ -->
  <rect x="20" y="88" width="980" height="28" rx="6" fill="#4facfe" opacity=".06"/>
  <text x="510" y="107" text-anchor="middle" fill="#4facfe" font-size="11" font-weight="700" letter-spacing="3">PRESENTATION LAYER</text>

  <rect x="20" y="260" width="980" height="28" rx="6" fill="#a18cd1" opacity=".06"/>
  <text x="510" y="279" text-anchor="middle" fill="#a18cd1" font-size="11" font-weight="700" letter-spacing="3">BUSINESS LOGIC LAYER</text>

  <rect x="20" y="470" width="980" height="28" rx="6" fill="#43e97b" opacity=".06"/>
  <text x="510" y="489" text-anchor="middle" fill="#43e97b" font-size="11" font-weight="700" letter-spacing="3">DATA / MODEL LAYER</text>

  <!-- ════════ USER ════════ -->
  <g transform="translate(420,8)">
    <text x="90" y="72" text-anchor="middle" fill="#ffecd2" font-size="18">👤</text>
    <text x="90" y="88" text-anchor="middle" fill="#ffecd2" font-size="10" font-weight="600">Terminal</text>
  </g>

  <!-- ════════ MAIN ════════ -->
  <g transform="translate(310,120)" filter="url(#d2)">
    <rect width="400" height="125" rx="14" fill="#12122a" stroke="#ffecd2" stroke-width="2"/>
    <rect width="400" height="30" rx="14" fill="#ffecd2" opacity=".08"/>
    <text x="200" y="21" text-anchor="middle" fill="#ffecd2" font-size="14" font-weight="700">Main.java</text>
    <text x="310" y="21" fill="#555" font-size="9">entry point</text>
    <line x1="14" y1="35" x2="386" y2="35" stroke="#ffecd2" opacity=".15"/>
    <text x="18" y="54" fill="#aab" font-size="11">static Scanner sc</text>
    <text x="18" y="70" fill="#aab" font-size="11">static ApplicationManager manager</text>
    <line x1="14" y1="80" x2="386" y2="80" stroke="#ffecd2" opacity=".1"/>
    <text x="18" y="97" fill="#ddd" font-size="11">main()  printMenu()  addInternship()  addJob()</text>
    <text x="18" y="113" fill="#ddd" font-size="11">searchApplication()  updateStatus()  deleteApplication()</text>
    <text x="18" y="79" fill="#555" font-size="9" text-anchor="end" x="388">146 lines</text>
  </g>

  <!-- stdin/stdout arrow -->
  <line x1="510" y1="98" x2="510" y2="120" stroke="#ffecd2" stroke-width="1.8" marker-end="url(#a1)"/>

  <!-- ════════ APPLICATION MANAGER ════════ -->
  <g transform="translate(260,300)" filter="url(#d2)">
    <rect width="500" height="148" rx="14" fill="#12122a" stroke="#a18cd1" stroke-width="2"/>
    <rect width="500" height="30" rx="14" fill="#a18cd1" opacity=".1"/>
    <text x="250" y="21" text-anchor="middle" fill="#a18cd1" font-size="14" font-weight="700">ApplicationManager.java</text>
    <text x="410" y="21" fill="#555" font-size="9">CRUD controller</text>
    <line x1="14" y1="35" x2="486" y2="35" stroke="#a18cd1" opacity=".15"/>
    <!-- fields -->
    <text x="18" y="55" fill="#e8a" font-size="11">— applications : ArrayList&lt;Application&gt;</text>
    <text x="18" y="71" fill="#e8a" font-size="11">— nextId : int  <tspan fill="#555">(starts at 1)</tspan></text>
    <line x1="14" y1="80" x2="486" y2="80" stroke="#a18cd1" opacity=".1"/>
    <!-- methods -->
    <text x="18" y="98" fill="#8cc" font-size="11">+ addApplication(app)  → assigns "APP{nextId++}"</text>
    <text x="18" y="114" fill="#8cc" font-size="11">+ viewApplications()   → formatted table to stdout</text>
    <text x="18" y="130" fill="#8cc" font-size="11">+ searchByCompany(str) → case-insensitive partial match → displayDetails()</text>
    <text x="18" y="146" fill="#8cc" font-size="11">+ updateStatus(id, s)  |  deleteApplication(id)  → boolean result</text>
  </g>

  <!-- Main → Manager arrow -->
  <line x1="510" y1="245" x2="510" y2="300" stroke="#a18cd1" stroke-width="2" marker-end="url(#a2)"/>
  <text x="520" y="278" fill="#a18cd1" font-size="10">delegates all CRUD</text>

  <!-- ════════ MODEL CLASSES ════════ -->
  <!-- Status -->
  <g transform="translate(40,510)" filter="url(#d2)">
    <rect width="170" height="130" rx="12" fill="#12122a" stroke="#f857a6" stroke-width="1.8"/>
    <rect width="170" height="26" rx="12" fill="#f857a6" opacity=".12"/>
    <text x="85" y="19" text-anchor="middle" fill="#f857a6" font-size="12" font-weight="700">«enum» Status</text>
    <line x1="10" y1="30" x2="160" y2="30" stroke="#f857a6" opacity=".2"/>
    <circle cx="22" cy="48" r="4" fill="#43e97b"/><text x="32" y="52" fill="#bbb" font-size="11">APPLIED</text>
    <circle cx="22" cy="68" r="4" fill="#4facfe"/><text x="32" y="72" fill="#bbb" font-size="11">INTERVIEW</text>
    <circle cx="22" cy="88" r="4" fill="#ffd700"/><text x="32" y="92" fill="#bbb" font-size="11">SELECTED</text>
    <circle cx="22" cy="108" r="4" fill="#f5576c"/><text x="32" y="112" fill="#bbb" font-size="11">REJECTED</text>
  </g>

  <!-- Application -->
  <g transform="translate(280,510)" filter="url(#d2)">
    <rect width="200" height="130" rx="12" fill="#12122a" stroke="#4facfe" stroke-width="1.8"/>
    <rect width="200" height="26" rx="12" fill="#4facfe" opacity=".12"/>
    <text x="100" y="19" text-anchor="middle" fill="#4facfe" font-size="12" font-weight="700">«abstract» Application</text>
    <line x1="10" y1="30" x2="190" y2="30" stroke="#4facfe" opacity=".2"/>
    <text x="14" y="50" fill="#aab" font-size="10">id, company, role, status</text>
    <text x="14" y="68" fill="#aab" font-size="10">getters / setters</text>
    <text x="14" y="88" fill="#ffa" font-size="10" font-style="italic">displayDetails() «abstract»</text>
    <line x1="10" y1="98" x2="190" y2="98" stroke="#4facfe" opacity=".12"/>
    <text x="14" y="116" fill="#555" font-size="9">Base for all application types</text>
  </g>

  <!-- InternshipApplication -->
  <g transform="translate(550,510)" filter="url(#d2)">
    <rect width="210" height="130" rx="12" fill="#12122a" stroke="#43e97b" stroke-width="1.8"/>
    <rect width="210" height="26" rx="12" fill="#43e97b" opacity=".12"/>
    <text x="105" y="19" text-anchor="middle" fill="#43e97b" font-size="12" font-weight="700">InternshipApplication</text>
    <line x1="10" y1="30" x2="200" y2="30" stroke="#43e97b" opacity=".2"/>
    <text x="14" y="50" fill="#aab" font-size="10">+ duration : int (months)</text>
    <text x="14" y="68" fill="#aab" font-size="10">+ stipend : double ($)</text>
    <line x1="10" y1="80" x2="200" y2="80" stroke="#43e97b" opacity=".12"/>
    <text x="14" y="98" fill="#43e97b" font-size="10">displayDetails() ✓</text>
    <text x="14" y="116" fill="#555" font-size="9">extends Application</text>
  </g>

  <!-- JobApplication -->
  <g transform="translate(810,510)" filter="url(#d2)">
    <rect width="180" height="130" rx="12" fill="#12122a" stroke="#fa709a" stroke-width="1.8"/>
    <rect width="180" height="26" rx="12" fill="#fa709a" opacity=".12"/>
    <text x="90" y="19" text-anchor="middle" fill="#fa709a" font-size="12" font-weight="700">JobApplication</text>
    <line x1="10" y1="30" x2="170" y2="30" stroke="#fa709a" opacity=".2"/>
    <text x="14" y="50" fill="#aab" font-size="10">+ salary : double ($)</text>
    <text x="14" y="68" fill="#aab" font-size="10">+ jobType : String</text>
    <line x1="10" y1="80" x2="170" y2="80" stroke="#fa709a" opacity=".12"/>
    <text x="14" y="98" fill="#fa709a" font-size="10">displayDetails() ✓</text>
    <text x="14" y="116" fill="#555" font-size="9">extends Application</text>
  </g>

  <!-- Manager → ArrayList<Application> arrow -->
  <line x1="510" y1="448" x2="400" y2="510" stroke="#43e97b" stroke-width="2" marker-end="url(#a3)"/>
  <text x="430" y="476" fill="#43e97b" font-size="10">stores ArrayList&lt;&gt;</text>

  <!-- Application → Status dependency -->
  <line x1="280" y1="575" x2="210" y2="575" stroke="#f857a6" stroke-width="1.4" stroke-dasharray="5 3"/>
  <polygon points="214,571 206,575 214,579" fill="#f857a6"/>

  <!-- Inheritance lines from subclasses to Application -->
  <line x1="550" y1="575" x2="480" y2="575" stroke="#4facfe" stroke-width="1.5" stroke-dasharray="6 3"/>
  <polygon points="484,571 476,575 484,579" fill="none" stroke="#4facfe" stroke-width="1.4"/>

  <line x1="810" y1="575" x2="480" y2="575" stroke="#4facfe" stroke-width="1.5" stroke-dasharray="6 3"/>

  <!-- instanceof check label -->
  <g transform="translate(560,448)">
    <rect width="185" height="22" rx="6" fill="#ffd700" opacity=".08" stroke="#ffd700" stroke-width=".8"/>
    <text x="92" y="15" text-anchor="middle" fill="#ffd700" font-size="9">instanceof for type detection</text>
  </g>
</svg>
