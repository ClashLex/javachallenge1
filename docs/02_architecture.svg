<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 720" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="b2" x1="0" y1="0" x2=".4" y2="1"><stop offset="0%" stop-color="#0e0e24"/><stop offset="100%" stop-color="#1a1440"/></linearGradient>
    <filter id="d2"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="g2"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="a1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#4facfe"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#a18cd1"/></marker>
    <marker id="a3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#43e97b"/></marker>
    <marker id="a4" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ffd700"/></marker>
  </defs>

  <rect width="1060" height="720" fill="url(#b2)" rx="18"/>
  <text x="530" y="42" text-anchor="middle" fill="#fff" font-size="26" font-weight="800" letter-spacing="1" filter="url(#g2)">System Architecture</text>
  <text x="530" y="66" text-anchor="middle" fill="#667" font-size="13">3-layer design with CSV file persistence  ·  console CLI application</text>

  <!-- LAYER LABELS -->
  <rect x="20" y="88" width="1020" height="26" rx="6" fill="#ffecd2" opacity=".05"/>
  <text x="530" y="106" text-anchor="middle" fill="#ffecd2" font-size="11" font-weight="700" letter-spacing="3">PRESENTATION LAYER</text>

  <rect x="20" y="268" width="1020" height="26" rx="6" fill="#a18cd1" opacity=".05"/>
  <text x="530" y="286" text-anchor="middle" fill="#a18cd1" font-size="11" font-weight="700" letter-spacing="3">BUSINESS LOGIC + PERSISTENCE LAYER</text>

  <rect x="20" y="498" width="1020" height="26" rx="6" fill="#43e97b" opacity=".05"/>
  <text x="530" y="516" text-anchor="middle" fill="#43e97b" font-size="11" font-weight="700" letter-spacing="3">DATA / MODEL LAYER</text>

  <!-- USER -->
  <g transform="translate(440,8)">
    <text x="90" y="72" text-anchor="middle" fill="#ffecd2" font-size="18">👤</text>
    <text x="90" y="88" text-anchor="middle" fill="#ffecd2" font-size="10" font-weight="600">Terminal User</text>
  </g>

  <!-- MAIN -->
  <g transform="translate(320,120)" filter="url(#d2)">
    <rect width="420" height="132" rx="14" fill="#12122a" stroke="#ffecd2" stroke-width="2"/>
    <rect width="420" height="30" rx="14" fill="#ffecd2" opacity=".08"/>
    <text x="210" y="21" text-anchor="middle" fill="#ffecd2" font-size="14" font-weight="700">Main.java</text>
    <text x="340" y="21" fill="#555" font-size="9">entry point · 146 lines</text>
    <line x1="14" y1="35" x2="406" y2="35" stroke="#ffecd2" opacity=".15"/>
    <text x="18" y="54" fill="#aab" font-size="11">static Scanner sc  ·  static ApplicationManager manager</text>
    <line x1="14" y1="64" x2="406" y2="64" stroke="#ffecd2" opacity=".1"/>
    <text x="18" y="82" fill="#ddd" font-size="11">main()  printMenu()  addInternship()  addJob()</text>
    <text x="18" y="98" fill="#ddd" font-size="11">searchApplication()  updateStatus()  deleteApplication()</text>
    <text x="18" y="116" fill="#888" font-size="10">getInput()  getIntInput()  getDoubleInput()  ← validation helpers</text>
  </g>

  <line x1="530" y1="98" x2="530" y2="120" stroke="#ffecd2" stroke-width="1.8" marker-end="url(#a1)"/>

  <!-- APPLICATION MANAGER -->
  <g transform="translate(220,305)" filter="url(#d2)">
    <rect width="620" height="172" rx="14" fill="#12122a" stroke="#a18cd1" stroke-width="2"/>
    <rect width="620" height="30" rx="14" fill="#a18cd1" opacity=".1"/>
    <text x="310" y="21" text-anchor="middle" fill="#a18cd1" font-size="14" font-weight="700">ApplicationManager.java</text>
    <text x="510" y="21" fill="#555" font-size="9">CRUD + persistence · 184 lines</text>
    <line x1="14" y1="35" x2="606" y2="35" stroke="#a18cd1" opacity=".15"/>
    <text x="18" y="55" fill="#e8a" font-size="11">— applications : ArrayList&lt;Application&gt;</text>
    <text x="18" y="71" fill="#e8a" font-size="11">— nextId : int  <tspan fill="#555">(auto-increment, synced from file)</tspan></text>
    <text x="18" y="87" fill="#e8a" font-size="11">— DATA_FILE : String = "data.csv"  <tspan fill="#555">(static final)</tspan></text>
    <line x1="14" y1="97" x2="606" y2="97" stroke="#a18cd1" opacity=".1"/>
    <text x="18" y="115" fill="#8cc" font-size="11">+ addApplication()  + viewApplications()  + searchByCompany()</text>
    <text x="18" y="131" fill="#8cc" font-size="11">+ updateStatus()    + deleteApplication()</text>
    <line x1="14" y1="140" x2="606" y2="140" stroke="#ffd700" opacity=".2"/>
    <text x="18" y="157" fill="#ffd700" font-size="11" font-weight="600">— saveToFile()  — loadFromFile()  — escape()  — splitCsv()</text>
    <text x="490" y="157" fill="#555" font-size="9">CSV persistence</text>
  </g>

  <line x1="530" y1="252" x2="530" y2="305" stroke="#a18cd1" stroke-width="2" marker-end="url(#a2)"/>
  <text x="540" y="282" fill="#a18cd1" font-size="10">delegates all CRUD</text>

  <!-- DATA.CSV (file on disk) -->
  <g transform="translate(30,340)" filter="url(#d2)">
    <rect width="160" height="100" rx="12" fill="#12122a" stroke="#ffd700" stroke-width="2"/>
    <rect width="160" height="26" rx="12" fill="#ffd700" opacity=".1"/>
    <text x="80" y="19" text-anchor="middle" fill="#ffd700" font-size="12" font-weight="700">📄 data.csv</text>
    <line x1="10" y1="30" x2="150" y2="30" stroke="#ffd700" opacity=".2"/>
    <text x="12" y="48" fill="#aab" font-size="9" font-family="Consolas,monospace">TYPE,ID,COMPANY,...</text>
    <text x="12" y="62" fill="#aab" font-size="9" font-family="Consolas,monospace">INTERNSHIP,APP1,...</text>
    <text x="12" y="76" fill="#aab" font-size="9" font-family="Consolas,monospace">JOB,APP2,...</text>
    <text x="80" y="94" text-anchor="middle" fill="#555" font-size="8">persistent storage on disk</text>
  </g>

  <!-- bidirectional arrows Manager ↔ data.csv -->
  <line x1="190" y1="370" x2="220" y2="370" stroke="#ffd700" stroke-width="2" marker-end="url(#a4)"/>
  <line x1="220" y1="395" x2="190" y2="395" stroke="#43e97b" stroke-width="2" marker-end="url(#a3)"/>
  <text x="152" y="364" fill="#ffd700" font-size="8">load</text>
  <text x="152" y="408" fill="#43e97b" font-size="8">save</text>

  <!-- MODEL CLASSES -->
  <g transform="translate(40,540)" filter="url(#d2)">
    <rect width="170" height="110" rx="12" fill="#12122a" stroke="#f857a6" stroke-width="1.8"/>
    <rect width="170" height="24" rx="12" fill="#f857a6" opacity=".12"/>
    <text x="85" y="17" text-anchor="middle" fill="#f857a6" font-size="12" font-weight="700">«enum» Status</text>
    <line x1="10" y1="28" x2="160" y2="28" stroke="#f857a6" opacity=".2"/>
    <circle cx="20" cy="44" r="4" fill="#43e97b"/><text x="30" y="48" fill="#bbb" font-size="10">APPLIED</text>
    <circle cx="20" cy="62" r="4" fill="#4facfe"/><text x="30" y="66" fill="#bbb" font-size="10">INTERVIEW</text>
    <circle cx="20" cy="80" r="4" fill="#ffd700"/><text x="30" y="84" fill="#bbb" font-size="10">SELECTED</text>
    <circle cx="20" cy="98" r="4" fill="#f5576c"/><text x="30" y="102" fill="#bbb" font-size="10">REJECTED</text>
  </g>

  <g transform="translate(280,540)" filter="url(#d2)">
    <rect width="195" height="110" rx="12" fill="#12122a" stroke="#4facfe" stroke-width="1.8"/>
    <rect width="195" height="24" rx="12" fill="#4facfe" opacity=".12"/>
    <text x="97" y="17" text-anchor="middle" fill="#4facfe" font-size="12" font-weight="700">«abstract» Application</text>
    <line x1="10" y1="28" x2="185" y2="28" stroke="#4facfe" opacity=".2"/>
    <text x="12" y="46" fill="#aab" font-size="10">id, company, role, status</text>
    <text x="12" y="64" fill="#aab" font-size="10">getters / setters</text>
    <text x="12" y="84" fill="#ffa" font-size="10" font-style="italic">displayDetails() «abstract»</text>
    <text x="12" y="102" fill="#555" font-size="9">Base for all types</text>
  </g>

  <g transform="translate(545,540)" filter="url(#d2)">
    <rect width="210" height="110" rx="12" fill="#12122a" stroke="#43e97b" stroke-width="1.8"/>
    <rect width="210" height="24" rx="12" fill="#43e97b" opacity=".12"/>
    <text x="105" y="17" text-anchor="middle" fill="#43e97b" font-size="12" font-weight="700">InternshipApplication</text>
    <line x1="10" y1="28" x2="200" y2="28" stroke="#43e97b" opacity=".2"/>
    <text x="12" y="48" fill="#aab" font-size="10">+ duration (months)</text>
    <text x="12" y="66" fill="#aab" font-size="10">+ stipend ($)</text>
    <text x="12" y="86" fill="#43e97b" font-size="10">displayDetails() ✓</text>
    <text x="12" y="102" fill="#555" font-size="9">extends Application</text>
  </g>

  <g transform="translate(825,540)" filter="url(#d2)">
    <rect width="195" height="110" rx="12" fill="#12122a" stroke="#fa709a" stroke-width="1.8"/>
    <rect width="195" height="24" rx="12" fill="#fa709a" opacity=".12"/>
    <text x="97" y="17" text-anchor="middle" fill="#fa709a" font-size="12" font-weight="700">JobApplication</text>
    <line x1="10" y1="28" x2="185" y2="28" stroke="#fa709a" opacity=".2"/>
    <text x="12" y="48" fill="#aab" font-size="10">+ salary ($)</text>
    <text x="12" y="66" fill="#aab" font-size="10">+ jobType (FT/PT/Contract)</text>
    <text x="12" y="86" fill="#fa709a" font-size="10">displayDetails() ✓</text>
    <text x="12" y="102" fill="#555" font-size="9">extends Application</text>
  </g>

  <!-- Manager → models arrows -->
  <line x1="530" y1="477" x2="400" y2="540" stroke="#43e97b" stroke-width="1.8" marker-end="url(#a3)"/>
  <text x="440" y="510" fill="#43e97b" font-size="10">stores ArrayList&lt;&gt;</text>

  <!-- Application → Status -->
  <line x1="280" y1="595" x2="210" y2="595" stroke="#f857a6" stroke-width="1.4" stroke-dasharray="5 3"/>
  <polygon points="214,591 206,595 214,599" fill="#f857a6"/>

  <!-- Subclass → Application inheritance -->
  <line x1="545" y1="595" x2="475" y2="595" stroke="#4facfe" stroke-width="1.5" stroke-dasharray="6 3"/>
  <polygon points="479,591 471,595 479,599" fill="none" stroke="#4facfe" stroke-width="1.4"/>
  <line x1="825" y1="595" x2="475" y2="595" stroke="#4facfe" stroke-width="1.5" stroke-dasharray="6 3"/>

  <!-- Key callout -->
  <g transform="translate(30,672)">
    <rect width="1000" height="28" rx="8" fill="#ffd700" opacity=".06" stroke="#ffd700" stroke-width=".8"/>
    <text x="500" y="18" text-anchor="middle" fill="#ffd700" font-size="11">💾  Data persists between sessions via data.csv — loadFromFile() on startup, saveToFile() on every add / update / delete</text>
  </g>
</svg>
