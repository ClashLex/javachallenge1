<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1550" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrow-tri" markerWidth="14" markerHeight="10" refX="14" refY="5" orient="auto">
      <polygon points="0 0, 14 5, 0 10" fill="#2c3e50"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="10" refX="14" refY="5" orient="auto">
      <polygon points="0 0, 14 5, 0 10" fill="#27ae60"/>
    </marker>
    <marker id="arrow-red" markerWidth="14" markerHeight="10" refX="14" refY="5" orient="auto">
      <polygon points="0 0, 14 5, 0 10" fill="#c0392b"/>
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="model-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf2f8"/>
      <stop offset="100%" stop-color="#d4e6f1"/>
    </linearGradient>
    <linearGradient id="service-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f8f5"/>
      <stop offset="100%" stop-color="#d1f2eb"/>
    </linearGradient>
    <linearGradient id="web-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdedec"/>
      <stop offset="100%" stop-color="#fadbd8"/>
    </linearGradient>
    <linearGradient id="pillar-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9e7"/>
      <stop offset="100%" stop-color="#fdebd0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1550" fill="#f7f9fc"/>

  <!-- ===== TITLE ===== -->
  <rect x="0" y="0" width="1200" height="65" fill="url(#header-grad)"/>
  <text x="600" y="40" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold">
    Internship &amp; Job Application Tracker — Architecture &amp; Data Flow
  </text>

  <!-- ===== SECTION 1: LAYER ARCHITECTURE ===== -->
  <rect x="30" y="85" width="1140" height="400" rx="10" fill="#fff" filter="url(#shadow)"/>
  <text x="50" y="115" fill="#2c3e50" font-size="18" font-weight="bold">1. Three-Layer Architecture</text>

  <!-- Layer labels -->
  <rect x="60" y="140" width="320" height="30" rx="6" fill="#e74c3c" opacity="0.85"/>
  <text x="220" y="160" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">WEB LAYER (Presentation)</text>

  <rect x="440" y="140" width="320" height="30" rx="6" fill="#27ae60" opacity="0.85"/>
  <text x="600" y="160" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">SERVICE LAYER (Controller)</text>

  <rect x="820" y="140" width="320" height="30" rx="6" fill="#2980b9" opacity="0.85"/>
  <text x="980" y="160" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">MODEL LAYER (Data)</text>

  <!-- Web Layer details -->
  <rect x="60" y="185" width="320" height="200" rx="8" fill="url(#web-grad)" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="220" y="210" text-anchor="middle" fill="#c0392b" font-size="14" font-weight="bold">WebServer.java</text>
  <line x1="90" y1="220" x2="350" y2="220" stroke="#e74c3c" stroke-width="0.5" opacity="0.4"/>
  <text x="80" y="242" fill="#333" font-size="12">• HttpServer on port 8080</text>
  <text x="80" y="262" fill="#333" font-size="12">• REST endpoints (GET/POST/PUT/DELETE)</text>
  <text x="80" y="282" fill="#333" font-size="12">• Serves static files from web/</text>
  <text x="80" y="302" fill="#333" font-size="12">• JSON serialization (no libraries)</text>
  <text x="80" y="322" fill="#333" font-size="12">• CORS headers for browser access</text>

  <rect x="130" y="345" width="180" height="25" rx="5" fill="#e74c3c" opacity="0.7"/>
  <text x="220" y="363" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">web/index.html</text>

  <!-- Service Layer details -->
  <rect x="440" y="185" width="320" height="200" rx="8" fill="url(#service-grad)" stroke="#27ae60" stroke-width="1.5"/>
  <text x="600" y="210" text-anchor="middle" fill="#1e8449" font-size="14" font-weight="bold">ApplicationManager.java</text>
  <line x1="470" y1="220" x2="730" y2="220" stroke="#27ae60" stroke-width="0.5" opacity="0.4"/>
  <text x="460" y="242" fill="#333" font-size="12">• ArrayList&lt;Application&gt; (in-memory)</text>
  <text x="460" y="262" fill="#333" font-size="12">• addApplication() — auto-assigns ID</text>
  <text x="460" y="282" fill="#333" font-size="12">• viewApplications() — table output</text>
  <text x="460" y="302" fill="#333" font-size="12">• searchByCompany() — partial match</text>
  <text x="460" y="322" fill="#333" font-size="12">• updateStatus() / deleteApplication()</text>
  <text x="460" y="342" fill="#333" font-size="12">• getApplications() — for web layer</text>

  <rect x="530" y="345" width="180" height="25" rx="5" fill="#27ae60" opacity="0.7"/>
  <text x="620" y="363" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Main.java (entry)</text>

  <!-- Model Layer details -->
  <rect x="820" y="185" width="320" height="200" rx="8" fill="url(#model-grad)" stroke="#2980b9" stroke-width="1.5"/>
  <text x="980" y="210" text-anchor="middle" fill="#1a5276" font-size="14" font-weight="bold">Application.java (abstract)</text>
  <line x1="850" y1="220" x2="1110" y2="220" stroke="#2980b9" stroke-width="0.5" opacity="0.4"/>
  <text x="840" y="242" fill="#333" font-size="12">— applicationId, company, role, status</text>
  <text x="840" y="262" fill="#333" font-size="12">— getters/setters (encapsulation)</text>
  <text x="840" y="282" fill="#333" font-size="12">— abstract displayDetails()</text>
  <line x1="850" y1="295" x2="1110" y2="295" stroke="#2980b9" stroke-width="0.5" opacity="0.3"/>
  <text x="840" y="315" fill="#1a5276" font-size="12" font-weight="bold">InternshipApplication</text>
  <text x="840" y="333" fill="#333" font-size="12">+ duration, stipend</text>
  <line x1="850" y1="342" x2="1110" y2="342" stroke="#2980b9" stroke-width="0.5" opacity="0.3"/>
  <text x="840" y="360" fill="#1a5276" font-size="12" font-weight="bold">JobApplication</text>
  <text x="840" y="378" fill="#333" font-size="12">+ salary, jobType</text>

  <!-- Status box -->
  <rect x="820" y="400" width="140" height="25" rx="5" fill="#8e44ad" opacity="0.8"/>
  <text x="890" y="417" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Status (enum)</text>

  <!-- Arrows between layers -->
  <line x1="380" y1="285" x2="435" y2="285" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="408" y="278" text-anchor="middle" fill="#555" font-size="10">HTTP</text>

  <line x1="760" y1="285" x2="815" y2="285" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="788" y="278" text-anchor="middle" fill="#555" font-size="10">calls</text>

  <!-- Browser box -->
  <rect x="60" y="400" width="140" height="25" rx="5" fill="#e67e22" opacity="0.8"/>
  <text x="130" y="417" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Browser</text>

  <line x1="200" y1="412" x2="435" y2="412" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-red)"/>
  <text x="318" y="405" text-anchor="middle" fill="#c0392b" font-size="10">HTTP requests</text>

  <!-- ===== SECTION 2: CLASS HIERARCHY ===== -->
  <rect x="30" y="505" width="1140" height="500" rx="10" fill="#fff" filter="url(#shadow)"/>
  <text x="50" y="535" fill="#2c3e50" font-size="18" font-weight="bold">2. Class Hierarchy — Inheritance &amp; Polymorphism</text>

  <!-- Application box (abstract) -->
  <rect x="420" y="555" width="360" height="150" rx="8" fill="#d5dbdb" stroke="#2c3e50" stroke-width="2"/>
  <rect x="420" y="555" width="360" height="32" rx="8" fill="#2c3e50"/>
  <rect x="420" y="575" width="360" height="12" fill="#2c3e50"/>
  <text x="600" y="576" text-anchor="middle" fill="#f1c40f" font-size="14" font-weight="bold">&lt;&lt;abstract&gt;&gt;</text>
  <text x="600" y="596" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">Application</text>
  <text x="435" y="622" fill="#2c3e50" font-size="12">— applicationId : String</text>
  <text x="435" y="642" fill="#2c3e50" font-size="12">— company : String</text>
  <text x="435" y="662" fill="#2c3e50" font-size="12">— role : String</text>
  <text x="435" y="682" fill="#2c3e50" font-size="12">— status : Status</text>
  <line x1="435" y1="690" x2="765" y2="690" stroke="#2c3e50" stroke-width="0.5"/>
  <text x="435" y="708" fill="#2c3e50" font-size="11" font-style="italic">+ displayDetails() : abstract</text>

  <!-- InternshipApplication box -->
  <rect x="140" y="745" width="360" height="150" rx="8" fill="url(#model-grad)" stroke="#2980b9" stroke-width="2"/>
  <rect x="140" y="745" width="360" height="32" rx="8" fill="#2980b9"/>
  <rect x="140" y="765" width="360" height="12" fill="#2980b9"/>
  <text x="320" y="776" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">InternshipApplication</text>
  <text x="155" y="802" fill="#1a5276" font-size="12">— duration : int</text>
  <text x="155" y="822" fill="#1a5276" font-size="12">— stipend : double</text>
  <line x1="155" y1="830" x2="485" y2="830" stroke="#2980b9" stroke-width="0.5"/>
  <text x="155" y="848" fill="#1a5276" font-size="11">+ displayDetails() : void</text>
  <text x="155" y="868" fill="#1a5276" font-size="11">+ getDuration() / setDuration()</text>
  <text x="155" y="888" fill="#1a5276" font-size="11">+ getStipend() / setStipend()</text>

  <!-- JobApplication box -->
  <rect x="700" y="745" width="360" height="150" rx="8" fill="url(#model-grad)" stroke="#2980b9" stroke-width="2"/>
  <rect x="700" y="745" width="360" height="32" rx="8" fill="#2980b9"/>
  <rect x="700" y="765" width="360" height="12" fill="#2980b9"/>
  <text x="880" y="776" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">JobApplication</text>
  <text x="715" y="802" fill="#1a5276" font-size="12">— salary : double</text>
  <text x="715" y="822" fill="#1a5276" font-size="12">— jobType : String</text>
  <line x1="715" y1="830" x2="1045" y2="830" stroke="#2980b9" stroke-width="0.5"/>
  <text x="715" y="848" fill="#1a5276" font-size="11">+ displayDetails() : void</text>
  <text x="715" y="868" fill="#1a5276" font-size="11">+ getSalary() / setSalary()</text>
  <text x="715" y="888" fill="#1a5276" font-size="11">+ getJobType() / setJobType()</text>

  <!-- Inheritance arrows -->
  <line x1="320" y1="705" x2="320" y2="740" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrow-tri)"/>
  <line x1="880" y1="705" x2="880" y2="740" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrow-tri)"/>

  <!-- Inheritance labels -->
  <text x="330" y="728" fill="#2c3e50" font-size="11" font-weight="bold">extends</text>
  <text x="888" y="728" fill="#2c3e50" font-size="11" font-weight="bold">extends</text>

  <!-- Status enum box -->
  <rect x="920" y="555" width="180" height="120" rx="8" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5"/>
  <rect x="920" y="555" width="180" height="28" rx="8" fill="#8e44ad"/>
  <rect x="920" y="575" width="180" height="8" fill="#8e44ad"/>
  <text x="1010" y="575" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Status (enum)</text>
  <text x="935" y="600" fill="#6c3483" font-size="12">• APPLIED</text>
  <text x="935" y="620" fill="#6c3483" font-size="12">• INTERVIEW</text>
  <text x="935" y="640" fill="#6c3483" font-size="12">• SELECTED</text>
  <text x="935" y="660" fill="#6c3483" font-size="12">• REJECTED</text>

  <!-- Relationship lines -->
  <line x1="780" y1="630" x2="915" y2="615" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="830" y="622" fill="#8e44ad" font-size="10">uses</text>

  <!-- Polymorphism note -->
  <rect x="420" y="920" width="360" height="65" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1"/>
  <text x="600" y="940" text-anchor="middle" fill="#d68910" font-size="13" font-weight="bold">Polymorphism in Action</text>
  <text x="600" y="960" text-anchor="middle" fill="#333" font-size="12">
    ArrayList&lt;Application&gt; stores both
  </text>
  <text x="600" y="978" text-anchor="middle" fill="#333" font-size="12">
    InternshipApplication and JobApplication
  </text>

  <!-- ===== SECTION 3: DATA FLOW ===== -->
  <rect x="30" y="1025" width="1140" height="240" rx="10" fill="#fff" filter="url(#shadow)"/>
  <text x="50" y="1055" fill="#2c3e50" font-size="18" font-weight="bold">3. Data Flow</text>

  <!-- Flow diagram elements -->
  <!-- Browser -->
  <rect x="60" y="1080" width="130" height="55" rx="8" fill="#f39c12" opacity="0.9"/>
  <text x="125" y="1102" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Browser</text>
  <text x="125" y="1120" text-anchor="middle" fill="#fff" font-size="10">HTML/CSS/JS</text>

  <line x1="190" y1="1107" x2="240" y2="1107" stroke="#e74c3c" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="215" y="1100" text-anchor="middle" fill="#c0392b" font-size="10">HTTP</text>

  <!-- WebServer -->
  <rect x="245" y="1075" width="150" height="65" rx="8" fill="#e74c3c" opacity="0.85"/>
  <text x="320" y="1097" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">WebServer</text>
  <text x="320" y="1115" text-anchor="middle" fill="#fff" font-size="10">REST Handler</text>
  <text x="320" y="1130" text-anchor="middle" fill="#fff" font-size="10">Static Files</text>

  <line x1="395" y1="1107" x2="445" y2="1107" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="420" y="1100" text-anchor="middle" fill="#1e8449" font-size="10">calls</text>

  <!-- ApplicationManager -->
  <rect x="450" y="1075" width="170" height="65" rx="8" fill="#27ae60" opacity="0.85"/>
  <text x="535" y="1097" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">ApplicationManager</text>
  <text x="535" y="1115" text-anchor="middle" fill="#fff" font-size="10">CRUD Operations</text>
  <text x="535" y="1130" text-anchor="middle" fill="#fff" font-size="10">ID Generation</text>

  <line x1="620" y1="1107" x2="670" y2="1107" stroke="#2980b9" stroke-width="2.5" marker-end="url(#arrow-tri)"/>
  <text x="645" y="1100" text-anchor="middle" fill="#1a5276" font-size="10">stores</text>

  <!-- ArrayList<Application> -->
  <rect x="675" y="1068" width="190" height="80" rx="8" fill="#2980b9" opacity="0.85"/>
  <text x="770" y="1090" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">ArrayList&lt;Application&gt;</text>
  <text x="770" y="1110" text-anchor="middle" fill="#fff" font-size="11">— InternshipApplication</text>
  <text x="770" y="1128" text-anchor="middle" fill="#fff" font-size="11">— JobApplication</text>
  <text x="770" y="1142" text-anchor="middle" fill="#fff" font-size="10">(in-memory)</text>

  <!-- Console menu path -->
  <rect x="60" y="1155" width="130" height="55" rx="8" fill="#2c3e50" opacity="0.85"/>
  <text x="125" y="1177" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Console</text>
  <text x="125" y="1195" text-anchor="middle" fill="#fff" font-size="10">Scanner Menu</text>

  <path d="M 190 1182 Q 300 1182 320 1182 Q 390 1182 445 1145" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="280" y="1175" text-anchor="middle" fill="#555" font-size="10">menu input</text>

  <!-- ===== SECTION 4: OOP PILLARS ===== -->
  <rect x="30" y="1285" width="1140" height="200" rx="10" fill="#fff" filter="url(#shadow)"/>
  <text x="50" y="1315" fill="#2c3e50" font-size="18" font-weight="bold">4. OOP Pillars Demonstrated</text>

  <!-- Encapsulation -->
  <rect x="60" y="1340" width="255" height="125" rx="8" fill="url(#pillar-grad)" stroke="#f39c12" stroke-width="1.5"/>
  <text x="188" y="1368" text-anchor="middle" fill="#d68910" font-size="15" font-weight="bold">Encapsulation</text>
  <line x1="80" y1="1378" x2="295" y2="1378" stroke="#f39c12" stroke-width="0.5"/>
  <text x="80" y="1400" fill="#333" font-size="12">All fields are private</text>
  <text x="80" y="1420" fill="#333" font-size="12">Access via getters/setters</text>
  <text x="80" y="1440" fill="#333" font-size="12">Data hidden from outside</text>
  <text x="80" y="1455" fill="#7f8c8d" font-size="11">e.g., private String role</text>

  <!-- Inheritance -->
  <rect x="335" y="1340" width="255" height="125" rx="8" fill="url(#pillar-grad)" stroke="#f39c12" stroke-width="1.5"/>
  <text x="463" y="1368" text-anchor="middle" fill="#d68910" font-size="15" font-weight="bold">Inheritance</text>
  <line x1="355" y1="1378" x2="570" y2="1378" stroke="#f39c12" stroke-width="0.5"/>
  <text x="355" y="1400" fill="#333" font-size="12">Application (superclass)</text>
  <text x="355" y="1420" fill="#333" font-size="12">← InternshipApplication</text>
  <text x="355" y="1440" fill="#333" font-size="12">← JobApplication</text>
  <text x="355" y="1455" fill="#7f8c8d" font-size="11">extends keyword</text>

  <!-- Polymorphism -->
  <rect x="610" y="1340" width="255" height="125" rx="8" fill="url(#pillar-grad)" stroke="#f39c12" stroke-width="1.5"/>
  <text x="738" y="1368" text-anchor="middle" fill="#d68910" font-size="15" font-weight="bold">Polymorphism</text>
  <line x1="630" y1="1378" x2="845" y2="1378" stroke="#f39c12" stroke-width="0.5"/>
  <text x="630" y="1400" fill="#333" font-size="12">ArrayList&lt;Application&gt; holds</text>
  <text x="630" y="1420" fill="#333" font-size="12">both sub-types</text>
  <text x="630" y="1440" fill="#333" font-size="12">displayDetails() overridden</text>
  <text x="630" y="1455" fill="#7f8c8d" font-size="11">@Override annotation</text>

  <!-- Abstraction -->
  <rect x="885" y="1340" width="255" height="125" rx="8" fill="url(#pillar-grad)" stroke="#f39c12" stroke-width="1.5"/>
  <text x="1013" y="1368" text-anchor="middle" fill="#d68910" font-size="15" font-weight="bold">Abstraction</text>
  <line x1="905" y1="1378" x2="1120" y2="1378" stroke="#f39c12" stroke-width="0.5"/>
  <text x="905" y="1400" fill="#333" font-size="12">Application is abstract</text>
  <text x="905" y="1420" fill="#333" font-size="12">Main → ApplicationManager only</text>
  <text x="905" y="1440" fill="#333" font-size="12">Implementation details hidden</text>
  <text x="905" y="1455" fill="#7f8c8d" font-size="11">abstract class &amp; methods</text>

  <!-- ===== LEGEND / KEY ===== -->
  <rect x="30" y="1505" width="1140" height="35" rx="6" fill="#ecf0f1"/>
  <rect x="50" y="1515" width="16" height="16" rx="3" fill="#2980b9"/>
  <text x="75" y="1528" fill="#333" font-size="11">Model Layer</text>
  <rect x="170" y="1515" width="16" height="16" rx="3" fill="#27ae60"/>
  <text x="195" y="1528" fill="#333" font-size="11">Service Layer</text>
  <rect x="300" y="1515" width="16" height="16" rx="3" fill="#e74c3c"/>
  <text x="325" y="1528" fill="#333" font-size="11">Web Layer</text>
  <line x1="420" y1="1523" x2="450" y2="1523" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrow-tri)"/>
  <text x="460" y="1528" fill="#333" font-size="11">Inheritance (extends)</text>
  <line x1="600" y1="1523" x2="630" y2="1523" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="1528" fill="#333" font-size="11">Data flow / Method call</text>
  <line x1="760" y1="1523" x2="790" y2="1523" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="800" y="1528" fill="#333" font-size="11">Console path</text>
</svg>
